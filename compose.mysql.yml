services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set_MYSQL_ROOT_PASSWORD_in_root_env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cherrylink}
      MYSQL_USER: ${MYSQL_USER:-cherrylink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set_MYSQL_PASSWORD_in_root_env}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - cherrylink_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  cherrylink_mysql_data:
